# Trusted: posts the report produced by "Catalog PR".
# Never checks out or runs PR code; the artifact is treated as data.
name: Catalog PR comment

on:
  workflow_run:
    workflows: ["Catalog PR"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report
      - name: Post or update comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(head -c 20 report/pr_number.txt | tr -d '[:space:]')
          if ! echo "$pr" | grep -Eq '^[0-9]+$'; then echo "bad PR number"; exit 1; fi
          python3 -c '
          import json, pathlib
          marker = "<!-- community-apps-report -->"
          body = pathlib.Path("report/report.md").read_text(encoding="utf-8", errors="replace")[:60000]
          pathlib.Path("body.json").write_text(json.dumps({"body": marker + "\n" + body}))
          '
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- community-apps-report -->"))) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input body.json > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --input body.json > /dev/null
          fi
