# Trusted: posts the report produced by "Catalog PR".
# For pull_request events GitHub runs the PR's own copy of catalog-pr.yml, so the
# artifact is untrusted data. This job finds the PR itself from the run's head
# commit, and only posts the artifact's report when the PR changes nothing but
# one catalog entry (then the workflow and tools that produced it are main's).
name: Catalog PR comment

on:
  # Trusted context on purpose: runs main's copy and only reads the artifact as data (see above).
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Catalog PR"]
    types: [completed]

permissions: {}

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the report artifact of the triggering run
      pull-requests: write # post or update the report comment
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report
      - name: Post or update comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/pr-comment.sh
