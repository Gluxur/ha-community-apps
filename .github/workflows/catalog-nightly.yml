name: Catalog nightly rescan

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rescan every approved repository, even unchanged ones
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Deploy key allowed to bypass the main ruleset; its pushes also
          # trigger "Publish catalog". Never exposed to pull_request runs.
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.3
      - name: Rescan, commit and flag entry by entry
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: bash .github/scripts/nightly.sh
