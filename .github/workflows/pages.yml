name: Publish catalog

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "tools/catalog/build.py"
  workflow_dispatch:

permissions: {}

# Never cancel a deployment in progress: GitHub Pages then fails the next ones.
# Pushes in a burst (nightly rescan) still collapse to the latest pending run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # deploy to GitHub Pages
      id-token: write # Pages deployment OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.3
      - run: python -m tools.catalog build --out site/catalog.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      # Pages sometimes misses an artifact uploaded a second earlier, or answers
      # "Deployment failed, try again later": retry once after a pause.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
